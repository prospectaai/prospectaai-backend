services:
  zookeeper:
    image: ubuntu/zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - prospectaai-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2181; echo srvr >&3; read -r -t 2 reply <&3; [[ \"$$reply\" == *\"Zookeeper version\"* || \"$$reply\" == *\"Mode:\"* ]]"]
      interval: 10s
      timeout: 5s
      retries: 10
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "9094:9094"
    networks:
      - prospectaai-network
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  service-discovery:
    build:
      context: .
      dockerfile: ./service-discovery/Dockerfile
    container_name: service-discovery
    depends_on:
      ms-auto-kafka-topic:
        condition: service_completed_successfully
    ports:
      - "8761:8761"
    networks:
      - prospectaai-network

  service-gateway:
    build:
      context: .
      dockerfile: ./service-gateway/Dockerfile
    container_name: service-gateway
    depends_on:
      service-discovery:
        condition: service_started
      ms-useraccount:
        condition: service_started
      ms-billing-sbs:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - prospectaai-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/

  ms-auto-kafka-topic:
    build:
      context: .
      dockerfile: ./ms-auto-kafka-topic/Dockerfile
    container_name: ms-auto-kafka-topic
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
    ports:
      - "9000:9000"
    networks:
      - prospectaai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-useraccount:
    build:
      context: .
      dockerfile: ./ms-useraccount/Dockerfile
    container_name: ms-useraccount
    depends_on:
      kafka:
        condition: service_healthy
      ms-auto-kafka-topic:
        condition: service_completed_successfully
      service-discovery:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      GOOGLE_CLIENT_ID: ${ENV_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${ENV_GOOGLE_CLIENT_SECRET} 
      GITHUB_CLIENT_ID: ${ENV_GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${ENV_GITHUB_CLIENT_SECRET}
      JWT_SECRET: ${ENV_JWT_SECRET}
      JWT_EXPIRATION_MS: ${ENV_JWT_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${ENV_JWT_REFRESH_EXPIRATION}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      BILLING_SERVICE_BASE_URL: http://ms-billing-sbs:8082
    ports:
      - "8081:8081"
    networks:
      - prospectaai-network

  ms-billing-sbs:
    build:
      context: .
      dockerfile: ./ms-billing-sbs/Dockerfile
    container_name: ms-billing-sbs
    depends_on:
      kafka:
        condition: service_healthy
      ms-auto-kafka-topic:
        condition: service_completed_successfully
      service-discovery:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
    ports:
      - "8082:8082"
    networks:
      - prospectaai-network    

  ms-email:
    build:
      context: .
      dockerfile: ./ms-email/Dockerfile
    container_name: ms-email
    depends_on:
      service-discovery:
        condition: service_started
      ms-auto-kafka-topic:
        condition: service_completed_successfully  
      kafka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_USERNAME: ${EMAIL_FROM}
      SPRING_MAIL_PASSWORD: ${EMAIL_PASSWORD}
    ports:
      - "8083:8083"
    networks:
      - prospectaai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-async-task:
    build:
      context: .
      dockerfile: ./ms-async-task/Dockerfile
    container_name: ms-async-task
    depends_on:
      service-discovery:
        condition: service_started
      ms-auto-kafka-topic:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
    ports:
      - "8084:8084"
    networks:
      - prospectaai-network

  ms-notification:
    build:
      context: .
      dockerfile: ./ms-notification/Dockerfile
    container_name: ms-notification
    depends_on:
      service-discovery:
        condition: service_started
      ms-auto-kafka-topic:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    networks:
      - prospectaai-network
networks:
  prospectaai-network:
    driver: bridge
